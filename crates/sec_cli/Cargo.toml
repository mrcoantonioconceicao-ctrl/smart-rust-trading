[package]
name = "sec_cli"
version = "0.1.0"
edition = "2021"

[dependencies]
sec_storage = { path = "../sec_storage" }
sec_crypto = { path = "../sec_crypto" }
sec_execution = { path = "../sec_execution" }
sec_ast = { path = "../sec_ast" }
sec_ai = { path = "../sec_ai" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.4", features = ["derive"] }
ureq = { version = "2.9", features = ["json"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
